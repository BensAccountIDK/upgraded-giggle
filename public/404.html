<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/upgraded-giggle/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Redirecting...</title>
    <script>
        // Preserve the pathname when redirecting 404s to index.html
        // This allows React Router to handle client-side routing
        const pathname = window.location.pathname;
        const search = window.location.search;
        const hash = window.location.hash;
        
        // Store the redirect path in sessionStorage so index.html can use it
        sessionStorage.setItem('redirect', pathname + search + hash);
        
        // Redirect to index.html
        window.location.replace('/upgraded-giggle/');
    </script>
</head>
<body>
    Redirecting...
</body>
</html>
